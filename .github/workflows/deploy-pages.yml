name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/powerball-daily-picks-9c63
  schedule:
    - cron: "30 4 * * 2,4,0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh draw archive
        env:
          EXPORT_REFRESH: "1"
        run: |
          pip install -r requirements.txt
          python scripts/export_draws.py
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
