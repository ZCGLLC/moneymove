name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - cursor/powerball-daily-picks-9c63
  schedule:
    # Powerball draws Mon/Wed/Sat at 10:59pm ET (02:59 UTC during EDT, 03:59 UTC during EST).
    - cron: "20 3 * * 2,4,0"
    - cron: "50 3 * * 2,4,0"
    - cron: "30 4 * * 2,4,0"
    - cron: "30 6 * * 2,4,0"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh draw archive
        env:
          EXPORT_REFRESH: "1"
        run: |
          pip install -r requirements.txt
          python scripts/export_draws.py
      - name: Commit updated archive
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/draws.json
          if git diff --cached --quiet; then
            echo "Archive already current"
          else
            git commit -m "Refresh Powerball archive after latest official draw"
            git push
          fi
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
